[project]
name = "scrapy-spiders"
version = "0.1.0"
description = "Scrapy crawlers for lead generation across job/production listing sites"
requires-python = ">=3.10"
dependencies = [
    "scrapy>=2.19,<3",
    "scrapy-impersonate>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scrapyspiders"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
