[project]
name = "scrapy-spiders"
version = "0.1.0"
description = "Scrapy crawlers for lead generation across job/production listing sites"
requires-python = ">=3.10"
dependencies = [
    "scrapy>=2.19,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scrapyspiders"]
